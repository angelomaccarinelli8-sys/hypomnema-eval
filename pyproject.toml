[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hypomnema-eval"
version = "0.1.0"
description = "Public evaluation harness for memory-system testing"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Angelo Maccarinelli" }
]
license = { text = "MIT" }
dependencies = [
  "pyyaml>=6.0",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "tqdm>=4.66.0"
]

[tool.setuptools]
packages = ["eval"]
